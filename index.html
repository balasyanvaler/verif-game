            margin-bottom: 10px;
            letter-spacing: 0.4px;
        }

            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 18px;

        }

            width: 100%;
            max-height: 250px;
            border-radius: 12px;
            background: #000;
            border: 1px solid rgba(56, 189, 248, 0.35);
            margin-bottom: 20px;
        }
        .restart-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #eab308 100%);
            color: #0f172a;
            font-weight: bold;
            padding: 12px 26px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }
        .restart-btn:hover {
            opacity: 0.92;
        }
        .back-arrow {
            position: absolute;
            top: 18px;
            left: 20px;
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 12px;
            font-size: 18px;
            line-height: 1;
            border-radius: 8px;
            cursor: pointer;
        }
        .back-arrow:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 20px;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .start-btn {
            padding: 14px 32px;
            font-size: 18px;
            margin-top: 10px;
        }
        .message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
        }
        .error {
            color: #f43f5e;
        }
        .success {
            color: #22c55e;
        }
        .meme-container {
            margin-top: 15px;
            display: none;
        }
        .meme-container video {
            width: 100%;
            max-height: 240px;
            border-radius: 12px;
            background: #000;
        }
        .progress {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;

<div class="card" id="introScreen">

        <br><br>

        <button id="retryBtn" style="display:none; background-color: #f43f5e; color: #fff;">Փորձել կրկին 🔄</button>
    </div>
</div>

            question: "🎯 Ո՞ւմ բողոքներն են թիմում ամենահաճախը հնչում, բայց միաժամանակ ամենաշատն են ժպիտ ու հումոր պարգևում",
            correctAnswers: ["նարեկ", "նարեկ մանուկյան", "մանուկյան", "narek", "narek manukyan", "manukyan"],
            successComment: "Ճիշտ է! Հենց Նարեկն է՝ ամենահումորով ու «բողոքող» կերպարը 😄😂🔥",
            successVideo: "https://res.cloudinary.com/ktuc4qkq/video/upload/v1795163084/narek_jisht.mp4",
            errorComment: "Չէ՛, սխալ պատասխան է։ Փորձի՛ր կրկին 😅",
            errorVideo: "https://res.cloudinary.com/ktuc4qkq/video/upload/v1795163085/narek_sxal.mp4"
        }
    ];

    let currentQuestionIndex = 0;

    const introScreen = document.getElementById("introScreen");
    const quizCard = document.getElementById("quizCard");
    const startBtn = document.getElementById("startBtn");
    const questionText = document.getElementById("questionText");
    const progressText = document.getElementById("progressText");
    const answerInput = document.getElementById("answerInput");
    const messageDiv = document.getElementById("message");
    const memeContainer = document.getElementById("memeContainer");
    const gameArea = document.getElementById("gameArea");
    const resultComment = document.getElementById("resultComment");
    const videoEl = document.getElementById("resultVideo");
    const nextBtn = document.getElementById("nextBtn");
    const retryBtn = document.getElementById("retryBtn");
    const checkBtn = document.getElementById("checkBtn");
    const backArrowBtn = document.getElementById("backArrowBtn");

    function showVictoryScreen() {
        videoEl.pause();
        quizCard.classList.add("victory-card");
        quizCard.innerHTML = `
            <h2 class="victory-title">🏆 ՀԱՂԹԱՆԱԿ 🎉</h2>
            <p class="victory-subtitle">Ապրե՜ս, իսկական չեմպիոնական հաղթանակ էր</p>
            <video class="victory-video" src="${victoryVideoUrl}" controls autoplay loop playsinline></video>
            <br>
            <button class="restart-btn" onclick="location.reload()">Խաղալ կրկին 🔄</button>
        `;
    }

    function returnToInput() {
        videoEl.pause();
        memeContainer.style.display = "none";
        backArrowBtn.style.display = "none";
        gameArea.style.display = "block";
        answerInput.value = "";
        messageDiv.innerText = "";
        answerInput.focus();
    }

    function loadQuestion() {
        videoEl.pause();
        backArrowBtn.style.display = "none";
        if (currentQuestionIndex < questions.length) {
            questionText.innerText = questions[currentQuestionIndex].question;
            progressText.innerText = `Հարց ${currentQuestionIndex + 1} / ${questions.length}`;
            answerInput.value = "";
            messageDiv.innerText = "";
            memeContainer.style.display = "none";
            gameArea.style.display = "block";
        } else {
            showVictoryScreen();
        }
    }

    function checkAnswer() {
        const userInput = answerInput.value.trim().toLowerCase();
        const currentQ = questions[currentQuestionIndex];

        if (!userInput) {
            messageDiv.className = "message error";
            messageDiv.innerText = "Գրիր անունը ⚠️";
            return;
        }

        const isCorrect = currentQ.correctAnswers.some(ans => userInput.includes(ans));
        gameArea.style.display = "none";
        memeContainer.style.display = "block";

        if (isCorrect) {
            messageDiv.className = "message success";
            messageDiv.innerText = "Ճիշտ է 🎉";
            resultComment.style.color = "#38bdf8";
            resultComment.innerText = currentQ.successComment;
            videoEl.src = currentQ.successVideo;
            nextBtn.style.display = "inline-block";
            retryBtn.style.display = "none";
            backArrowBtn.style.display = "inline-block";
        } else {
            messageDiv.className = "message error";
            messageDiv.innerText = "Սխալ պատասխան է ❌";
            resultComment.style.color = "#f43f5e";
            resultComment.innerText = currentQ.errorComment;
            videoEl.src = currentQ.errorVideo;
            nextBtn.style.display = "none";
            retryBtn.style.display = "inline-block";
            backArrowBtn.style.display = "none";
        }

        videoEl.load();
        videoEl.play().catch(e => console.log("Autoplay:", e));
    }

    if (startBtn) {
        startBtn.addEventListener("click", function() {
            introScreen.style.display = "none";
            quizCard.style.display = "block";
            loadQuestion();
        });
    }

    checkBtn.addEventListener("click", checkAnswer);
    backArrowBtn.addEventListener("click", returnToInput);
    retryBtn.addEventListener("click", returnToInput);

    nextBtn.addEventListener("click", function() {
        currentQuestionIndex++;
        loadQuestion();
    });

    answerInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") checkAnswer();
    });
})();
</script>

</body>
</html>
